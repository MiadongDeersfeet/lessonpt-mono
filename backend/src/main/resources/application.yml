# LessonPT 공통 설정.
# 스키마 접속 정보는 프로파일 파일로 나누고, 비밀번호는 환경변수로만 받는다.

spring:
  application:
    name: lessonpt
  profiles:
    # 기본은 로컬 개발. 테스트와 배포는 LESSONPT_PROFILE=test|prod 로 바꾼다.
    active: ${LESSONPT_PROFILE:local}
  autoconfigure:
    exclude:
      # 생성된 메모리 사용자와 임시 비밀번호를 쓰지 않는다. Teacher JWT는 이후 단계에서 붙인다.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      # URL이 없을 때도 Hikari를 만들려다 기동이 멈추지 않게, 풀은 OracleDataSourceConfig에서만 만든다.
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

lessonpt:
  oracle:
    # 지금 개발 Schema 이름이다. 다른 계정이면 LESSONPT_DB_EXPECTED_SCHEMA 로 바꾼다.
    expected-schema: ${LESSONPT_DB_EXPECTED_SCHEMA:DRUMMER_LMS}
  jwt:
    # 실제 값은 LESSONPT_JWT_SECRET 환경변수로만 넣는다. 32바이트 이상이어야 한다.
    secret: "LessonPT-Test-JWT-Secret-2026-09-25-7f4c9b2e6a1d8f3c5e0a"
    access-token-ttl: 60m
    refresh-token-ttl: 14d
  student-session:
    # 배포 환경은 Secure를 유지한다. 로컬 HTTP는 local 프로파일에서만 완화한다.
    secure: true
  storage:
    provider: ${LESSONPT_STORAGE_PROVIDER:oci}
    oci:
      # Windows 기본 경로는 local 개발용이다. 배포는 LESSONPT_OCI_CONFIG_FILE로 바꾼다.
      config-file: ${LESSONPT_OCI_CONFIG_FILE:C:/Portfolio/Secret/config/config.txt}
      profile: ${LESSONPT_OCI_PROFILE:DEFAULT}
      bucket-name: ${LESSONPT_OCI_BUCKET_NAME:lessonpt-resources}

mybatis:
  # 도메인 Mapper XML은 기능을 추가할 때 mapper 아래에 둔다.
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.yunki.lessonpt.common.mybatis.typehandler
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    # 요청 필터가 MDC에 넣은 traceId를 오류 로그와 같은 값으로 남긴다.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] [%X{traceId:-}] %-40.40logger{39} : %m%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 로컬과 테스트에서 oracle 항목을 바로 보게 한다. prod는 상세를 숨긴다.
      show-details: always

---
spring:
  config:
    activate:
      on-profile: local
lessonpt:
  student-session:
    # Vite proxy로 붙는 localhost HTTP에서 쿠키가 저장되게 한다.
    secure: false
    same-site: Lax
