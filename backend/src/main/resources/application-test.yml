# 환경변수가 있을 때만 조회 테스트를 실행한다.
# 전용 테스트 Schema는 아직 없고, 지금 변수가 개발 Schema를 가리켜도 INSERT는 하지 않는다.
# LESSONPT_DB_URL, LESSONPT_DB_USERNAME, LESSONPT_DB_PASSWORD
# LESSONPT_DB_EXPECTED_SCHEMA 를 생략하면 기대 Schema는 DRUMMER_LMS 다.

spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${LESSONPT_DB_URL}
    username: ${LESSONPT_DB_USERNAME}
    password: ${LESSONPT_DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: 1
      minimum-idle: 0

logging:
  level:
    com.yunki.lessonpt.common.health.SmokeMapper: debug
