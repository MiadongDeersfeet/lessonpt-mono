name: Deploy LessonPT

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lessonpt-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x backend/mvnw
          cd backend
          ./mvnw -B clean verify

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        shell: bash
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        shell: bash
        working-directory: frontend
        run: npm test

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: npm run build

      - name: Prepare deployment workspace
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR, found ${#jars[@]}"
            exit 1
          fi
          mkdir -p deploy-workspace/backend deploy-workspace/frontend
          cp "${jars[0]}" deploy-workspace/backend/lessonpt.jar
          cp -a frontend/dist/. deploy-workspace/frontend/
          test -f deploy-workspace/backend/lessonpt.jar
          test -f deploy-workspace/frontend/index.html

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: lessonpt-deploy
          path: |
            deploy-workspace/backend/lessonpt.jar
            deploy-workspace/frontend/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: lessonpt-deploy
          path: deploy

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lessonpt_key
          chmod 600 ~/.ssh/lessonpt_key
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Upload release files
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail
          test -f deploy/backend/lessonpt.jar
          test -f deploy/frontend/index.html
          tar -C deploy/frontend -czf "${RUNNER_TEMP}/lessonpt-frontend.tar.gz" .
          scp \
            -i ~/.ssh/lessonpt_key \
            -o BatchMode=yes \
            deploy/backend/lessonpt.jar \
            "${OCI_USER}@${OCI_HOST}:/tmp/lessonpt.jar.new"
          scp \
            -i ~/.ssh/lessonpt_key \
            -o BatchMode=yes \
            "${RUNNER_TEMP}/lessonpt-frontend.tar.gz" \
            "${OCI_USER}@${OCI_HOST}:/tmp/lessonpt-frontend.tar.gz"

      - name: Deploy on OCI
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/lessonpt_key \
            -o BatchMode=yes \
            "${OCI_USER}@${OCI_HOST}" \
            bash -s <<'EOF'
          set -euo pipefail

          rollback() {
            set +e
            echo "=== ROLLBACK ==="
            if [ "${HAD_PREVIOUS_JAR:-0}" -eq 1 ]; then
              cp -f "/opt/lessonpt/backend/releases/lessonpt-${TIMESTAMP}.jar" /opt/lessonpt/backend/lessonpt.jar
              chmod 644 /opt/lessonpt/backend/lessonpt.jar
            fi
            if [ "${FRONTEND_MOVED_ASIDE:-0}" -eq 1 ] && [ -d /var/www/lessonpt.prev ]; then
              sudo rm -rf /var/www/lessonpt
              sudo mv /var/www/lessonpt.prev /var/www/lessonpt
              sudo chown -R opc:opc /var/www/lessonpt
              sudo restorecon -RF /var/www/lessonpt
            fi
            if [ "${HAD_PREVIOUS_JAR:-0}" -eq 1 ]; then
              sudo systemctl restart lessonpt
            else
              sudo systemctl stop lessonpt
            fi
            set -e
          }

          fail_deploy() {
            trap - ERR
            echo "=== LESSONPT STATUS ==="
            sudo systemctl status lessonpt --no-pager || true
            echo "=== LESSONPT JOURNAL ==="
            sudo journalctl -u lessonpt -n 100 --no-pager || true
            rollback
            exit 1
          }

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          HAD_PREVIOUS_JAR=0
          FRONTEND_MOVED_ASIDE=0
          trap fail_deploy ERR

          echo "=== Backend backup ==="
          mkdir -p /opt/lessonpt/backend/releases
          if [ -f /opt/lessonpt/backend/lessonpt.jar ]; then
            cp -p /opt/lessonpt/backend/lessonpt.jar "/opt/lessonpt/backend/releases/lessonpt-${TIMESTAMP}.jar"
            HAD_PREVIOUS_JAR=1
          fi
          mv /tmp/lessonpt.jar.new /opt/lessonpt/backend/lessonpt.jar
          chmod 644 /opt/lessonpt/backend/lessonpt.jar

          echo "=== Frontend staging ==="
          FRONTEND_NEXT="/tmp/lessonpt-frontend-${TIMESTAMP}"
          mkdir -p "$FRONTEND_NEXT"
          tar -xzf /tmp/lessonpt-frontend.tar.gz -C "$FRONTEND_NEXT"
          test -f "$FRONTEND_NEXT/index.html"
          if [ -d /var/www/lessonpt.prev ]; then
            sudo rm -rf /var/www/lessonpt.prev
          fi
          if [ -d /var/www/lessonpt ]; then
            sudo mv /var/www/lessonpt /var/www/lessonpt.prev
            FRONTEND_MOVED_ASIDE=1
          fi
          sudo mv "$FRONTEND_NEXT" /var/www/lessonpt
          sudo chown -R opc:opc /var/www/lessonpt
          sudo restorecon -RF /var/www/lessonpt

          echo "=== Spring Boot ==="
          sudo systemctl daemon-reload
          sudo systemctl enable lessonpt
          sudo systemctl restart lessonpt

          health_ok=0
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if response=$(curl -fsS --max-time 5 http://127.0.0.1:8080/actuator/health) \
              && printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              health_ok=1
              break
            fi
            sleep 3
          done
          unset response

          if [ "$health_ok" -ne 1 ]; then
            fail_deploy
          fi

          echo "LESSONPT_BACKEND_HEALTH_OK"
          sudo systemctl is-active lessonpt
          sudo systemctl is-active nginx
          # Use the production virtual host and verify the deployed SPA entry point.
          for route in / /signup; do
            curl -fsS --connect-timeout 5 --max-time 15 \
              --resolve lessonpt.cloud:443:127.0.0.1 \
              "https://lessonpt.cloud${route}" \
              | cmp - /var/www/lessonpt/index.html
          done

          trap - ERR
          echo "=== Successful deployment ==="
          mapfile -t release_jars < <(ls -1t /opt/lessonpt/backend/releases/lessonpt-*.jar 2>/dev/null || true)
          if [ "${#release_jars[@]}" -gt 3 ]; then
            rm -f "${release_jars[@]:3}"
          fi

          echo "LESSONPT_DEPLOY_OK"
          EOF
